<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Ponte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: página de apresentação com um aparelho (celular ou totem) no centro; dentro dele, telas com uma ação principal cada */
:root{
  --ink:#16252F; --ink-2:#4A5A63; --line:#DCE3E2; --paper:#F3F6F5; --card:#FFFFFF;
  --urgent:#C2561B; --urgent-soft:#FBE9DD; --future:#22706B; --future-soft:#DDEFEC;
  --navy:#182A36; --ok:#2E7D4F; --ok-soft:#E1F2E7; --focus:#2F6FE4;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#E7EEEC; --ink-2:#A7B6B3; --line:#2C3B42; --paper:#0F1A20; --card:#17252C;
  --urgent:#F08A4B; --urgent-soft:#3A2416; --future:#5BC1B7; --future-soft:#163330;
  --navy:#0B141A; --ok:#6CCB92; --ok-soft:#173326; --focus:#7FA8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#E7EEEC; --ink-2:#A7B6B3; --line:#2C3B42; --paper:#0F1A20; --card:#17252C;
  --urgent:#F08A4B; --urgent-soft:#3A2416; --future:#5BC1B7; --future-soft:#163330;
  --navy:#0B141A; --ok:#6CCB92; --ok-soft:#173326; --focus:#7FA8FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{max-width:1040px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.brand h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1}
.brand h1 span{color:var(--future)}
.switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.switch button{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:700;color:var(--ink-2)}
.switch button[aria-pressed="true"]{background:var(--navy);color:#fff}
.stage{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;font-size:14px;color:var(--ink-2)}
.side h2{font-family:var(--display);font-size:17px;color:var(--ink);margin:0}
.side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.side .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.side .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--future)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.side{order:2}}

/* ---------- aparelho ---------- */
.device{margin:0 auto;background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column}
.device.phone{width:100%;max-width:390px;height:760px;border-radius:36px;border:10px solid #10181D;box-shadow:0 20px 50px -20px rgba(10,30,40,.45)}
.device.kiosk{width:100%;max-width:720px;min-height:540px;border-radius:18px;border:14px solid #2A363D;box-shadow:0 24px 50px -24px rgba(10,30,40,.5)}
.kiosk-base{max-width:180px;height:60px;margin:0 auto;background:linear-gradient(#2A363D,#1B2429);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
@media (max-width:480px){.device.phone{border-width:6px;border-radius:26px;height:720px}.device.kiosk{border-width:8px}}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;font-size:calc(16px*var(--fs))}
.bar{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
.bar h2{flex:1;margin:0;font-family:var(--display);font-size:calc(19px*var(--fs));font-weight:600;min-width:0}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:700;font-size:14px}
.icon-btn svg{width:20px;height:20px}
.body{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.hint{color:var(--ink-2);margin:0}
.door{border:0;border-radius:22px;padding:20px;text-align:left;display:flex;gap:16px;align-items:center;min-height:120px}
.door .ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.22)}
.door .ico svg{width:32px;height:32px}
.door b{display:block;font-family:var(--display);font-size:calc(23px*var(--fs));line-height:1.1}
.door span{font-size:calc(14px*var(--fs));opacity:.92}
.door.urgent{background:var(--urgent);color:#fff}
.door.future{background:var(--future);color:#fff}
:root[data-theme="dark"] .door.urgent,:root[data-theme="dark"] .door.future{color:#10181D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .door.urgent,:root:not([data-theme="light"]) .door.future{color:#10181D}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:calc(16px*var(--fs));min-height:110px;justify-content:center;text-align:center}
.tile svg{width:36px;height:36px}
.tile.u svg{color:var(--urgent)} .tile.f svg{color:var(--future)}
.tile:hover{border-color:var(--ink-2)}
.tile small{font-weight:400;color:var(--ink-2);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--future);border-color:var(--future);color:#fff}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
button.card:hover{border-color:var(--ink-2)}
.card h3{margin:0;font-size:calc(17px*var(--fs))}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--future-soft);color:var(--future)}
.pill.u{background:var(--urgent-soft);color:var(--urgent)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.cta{border:0;border-radius:16px;min-height:58px;padding:14px 18px;font-weight:700;font-size:calc(18px*var(--fs));width:100%;background:var(--future);color:#fff}
.cta.u{background:var(--urgent)} .cta.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.cta:disabled{opacity:.4;cursor:not-allowed}
:root[data-theme="dark"] .cta:not(.ghost),:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#10181D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cta:not(.ghost),:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#10181D}}
.foot{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);background:var(--card)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav button{flex:1;border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink-2)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="true"]{color:var(--future)}
.badge{background:var(--urgent);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;font-size:calc(18px*var(--fs));padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
.field input:focus{border-color:var(--future);outline:none}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:8px auto 0}
.check svg{width:46px;height:46px}
.center{text-align:center}
.big{font-family:var(--display);font-size:calc(26px*var(--fs));margin:0;line-height:1.15;text-wrap:balance}
.map{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);height:300px;background:var(--future-soft)}
.map svg.streets{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.pin i{display:block;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--urgent);border:3px solid var(--card);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pin i.closed{background:var(--ink-2)}
.pin span{margin-top:4px;background:var(--card);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.me{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--focus);border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,111,228,.2);transform:translate(-50%,-50%)}
.steps{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.steps li b{width:28px;height:28px;flex:none;border-radius:50%;background:var(--future-soft);color:var(--future);display:grid;place-items:center;font-size:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);width:100%;text-align:left}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--ok)} .toggle[aria-pressed="true"] .sw::after{left:23px}
.toast{position:absolute;left:12px;right:12px;bottom:84px;background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center;z-index:9;animation:up .25s ease}
.toast button{background:none;border:0;color:#9FE0D8;font-weight:700}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* totem */
.k-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--navy);color:#fff}
.k-bar b{font-family:var(--display);font-size:20px;flex:1}
.k-bar .icon-btn{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.progress{display:flex;gap:6px;padding:12px 18px 0}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--future)}
.k-body{padding:18px 22px;display:flex;flex-direction:column;gap:16px;flex:1}
.k-body .big{font-size:calc(28px*var(--fs))}
.k-foot{display:flex;gap:12px;padding:14px 22px 20px;border-top:1px solid var(--line)}
.k-foot .cta{flex:1}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.keys button{border:1px solid var(--line);background:var(--paper);border-radius:8px;height:44px;font-weight:700;font-size:16px}
.keys .wide{grid-column:span 3}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink-2)}
.day b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{border-color:var(--future);background:var(--future-soft)}
.day:disabled{opacity:.35}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;display:flex;align-items:center;gap:12px;width:100%;font-size:calc(17px*var(--fs))}
.opt[aria-pressed="true"]{border-color:var(--future);background:var(--future-soft)}
.opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-2);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .dot{border-color:var(--future)}
.opt[aria-pressed="true"] .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--future)}
.ticket{background:#fff;color:#16252F;border-radius:6px;padding:16px 18px;font-family:"Courier New",monospace;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-width:300px;margin:0 auto;width:100%;border-top:6px dashed #c9d2d0}
.ticket.printing{animation:print 1.4s ease}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.ticket hr{border:0;border-top:1px dashed #9aa;margin:8px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.sumtbl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:calc(17px*var(--fs))}
.sumtbl dt{color:var(--ink-2)} .sumtbl dd{margin:0;font-weight:700}
.note{font-size:12px;color:var(--ink-2);text-align:center;margin-top:10px}
.switch{flex-wrap:wrap}
.device.web{width:100%;max-width:720px;min-height:600px;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 44px -24px rgba(10,30,40,.4)}
.web-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.web-bar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.web-bar span{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:16px 22px;border-bottom:1px solid var(--line)}
.p-head .org{flex:1;min-width:0}
.p-head .org b{display:block;font-family:var(--display);font-size:20px}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--future-soft);color:var(--future);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.field select,.field textarea{font:inherit;font-size:16px;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
.field textarea{min-height:70px;resize:vertical}
.err{color:var(--urgent);font-size:13px;font-weight:700}
.acao{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.acao .info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.small-btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.stat{display:flex;gap:12px;flex-wrap:wrap}
.stat div{flex:1;min-width:120px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cat4{grid-template-columns:repeat(4,minmax(0,1fr))}@media (max-width:560px){.cat4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
</style>

<header class="top">
  <div class="brand"><small>IHC · Mackenzie · Projeto Parte 3</small><h1>Ponte<span>.</span></h1></div>
  <div class="switch" role="group" aria-label="Canal">
    <button id="mode-app" aria-pressed="true">Aplicativo (celular)</button>
    <button id="mode-kiosk" aria-pressed="false">Totem (CRAS / Centro POP)</button>
    <button id="mode-partner" aria-pressed="false">Parceiro</button>
  </div>
</header>

<main class="stage">
  <div id="device-wrap"></div>
  <aside class="side" id="side"></aside>
</main>

<script>
const ICONS={
 back:'<path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 sound:'<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
 bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor"/>',
 sprout:'<path d="M12 21v-9M12 12c0-4 3-7 8-7 0 5-3 7-8 7zM12 14c0-3-2-6-7-6 0 4 2 6 7 6z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 bag:'<rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 12h18" stroke="currentColor" stroke-width="2" fill="none"/>',
 book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 19a2 2 0 012-2h13" stroke="currentColor" stroke-width="2" fill="none"/>',
 money:'<rect x="2" y="6" width="20" height="12" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>',
 id:'<rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="11" r="2.2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5.5 16c.7-1.7 2-2.5 3.5-2.5s2.8.8 3.5 2.5M14 10h4M14 13h3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
 food:'<path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 2-3 4-3 7h3v11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',
 shower:'<path d="M4 20V8a4 4 0 014-4h0a4 4 0 014 4M9 11h6a3 3 0 00-6 0zM10 15v1M13 15v2M16 15v1M11.5 18v1M14.5 18v1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
 shirt:'<path d="M8 3l-5 3 2 5 2-1v11h10V10l2 1 2-5-5-3a4 4 0 01-8 0z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
 user:'<circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 mapi:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'
};
const ic=(n)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- dados fictícios ---------- */

S.p={scr:'lista',draft:newDraft(),errs:{},acoes:[],last:null};
const hh=(t)=>{const [h,m]=t.split(':');return `${+h}h${m==='00'?'':m}`};

let seq=0;
function addAcao(d){const id='pa'+(++seq);const [bx,by]=BAIRROS[d.bairro];const x=bx+(seq%3-1)*5,y=by+(seq%2?4:-4);
 const m=Math.round(Math.hypot(x-50,y-50)*28/10)*10;
 const p={id,n:d.nome,k:CATDESC[d.cat]+(d.qtd?` · até ${d.qtd} pessoas`:''),h:`${diasTxt(d.dias)}, ${hh(d.ini)} às ${hh(d.fim)}`,d:m>=1000?(m/1000).toFixed(1).replace('.',',')+' km':m+' m',min:Math.max(3,Math.round(m/80)),end:`${d.rua} · ${d.bairro}`,open:true,x,y,org:ORG,qtd:+d.qtd||0,obs:d.obs};
 PONTOS[d.cat].push(p);S.p.acoes.unshift({id,cat:d.cat});return p}

function render(resetScroll){
 const keep=document.activeElement&&document.activeElement.id;const pos=keep&&document.activeElement.selectionStart;
 const prev=document.getElementById('scr');const st=prev&&!resetScroll?prev.scrollTop:0;
 document.documentElement.style.setProperty('--fs',S.fs);
 document.getElementById('device-wrap').innerHTML=S.mode==='app'?renderApp():S.mode==='kiosk'?renderKiosk():renderPartner();
 document.getElementById('side').innerHTML=side();
 document.getElementById('mode-app').setAttribute('aria-pressed',S.mode==='app');
 document.getElementById('mode-kiosk').setAttribute('aria-pressed',S.mode==='kiosk');
 document.getElementById('mode-partner').setAttribute('aria-pressed',S.mode==='partner');
 const s=document.getElementById('scr');if(s)s.scrollTop=st;
 if(keep){const el=document.getElementById(keep);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function kgo(scr){S.k.scr=scr;render(true)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;const a=A(),k=S.k;
 if(b.id==='mode-app'){S.mode='app';return render(true)}
 if(b.id==='mode-kiosk'){S.mode='kiosk';return render(true)}
 if(b.id==='mode-partner'){S.mode='partner';return render(true)}
 if(d.go)return go(d.go);
 if(d.k&&!d.act)return kgo(d.k);
 switch(d.act){
  case 'back':return back();
  case 'tab':return tab(d.t);
  case 'jump':A().tab='home';A().stack=['home','mudar',d.to];return render(true);
  case 'fs':S.fs=S.fs>=1.25?1:+(S.fs+.125).toFixed(3);toast(S.fs===1?'Letra no tamanho normal':'Letra maior');return;
  case 'speak':return speak(d.say);
  case 'kspeak':return speak(KSAY[k.scr]||'');
  case 'whats':return toast('Abrindo conversa no WhatsApp (simulado)');
  case 'toast':return toast(d.msg);
  case 'tomode':S.mode='kiosk';return render(true);
  case 'filt':a[d.k]=d.v;return render();
  case 'clearf':a.filtB='Todos';a.filtA='Todas';return render();
  case 'vaga':a.vaga=+d.id;return go('vaga');
  case 'apply':if(!a.cv){a.after='apply';return go('cv')}
   a.apps.push({id:a.vaga});a.stack=[a.tab,'okvaga'];return render(true);
  case 'exp':{const x=a.cvDraft.exp;const i=x.indexOf(d.v);i<0?x.push(d.v):x.splice(i,1);return render()}
  case 'cvsave':a.cv={...a.cvDraft,exp:[...a.cvDraft.exp]};a.apps.push({id:a.vaga});a.stack=[a.tab,'okvaga'];return render(true);
  case 'cat':a.cat=d.k;a.view='mapa';return go('mapa');
  case 'view':a.view=d.v;return render();
  case 'open':a.openOnly=!a.openOnly;return render();
  case 'ponto':a.ponto=d.id;return go('ponto');
  case 'lembrete':{const i=a.lembretes.indexOf(a.ponto);if(i<0){a.lembretes.push(a.ponto);toast('Lembrete ativado',true)}else{a.lembretes.splice(i,1);toast('Lembrete desligado')}return}
  case 'undo':{const i=a.lembretes.indexOf(a.ponto);if(i>=0)a.lembretes.splice(i,1);S.toast=null;return render()}
  case 'nocpf':k.noCpf=!k.noCpf;if(k.noCpf)k.cpf='';return render();
  case 'key':{if(d.c==='⌫')k.nome=k.nome.slice(0,-1);else k.nome+=(k.nome===''||k.nome.endsWith(' '))?d.c:d.c.toLowerCase();return render()}
  case 'ksvc':if(d.s==='docs')return kgo('docs');if(['comida','abrigo','roupas'].includes(d.s)){k.svc=d.s;return kgo('lista')}k.svcN={vagas:'Vagas',benef:'Benefícios'}[d.s];return kgo('outro');
  case 'kdoc':k.doc=d.id;return render();
  case 'kposto':k.posto=d.id;return render();
  case 'kdia':k.dia=+d.i;k.hora=null;return render();
  case 'khora':k.hora=d.h;return render();
  case 'kconf':k.printed=false;return kgo('fim');
  case 'kprint':k.printed=true;render();k.printed=false;return toast('Imprimindo comprovante…');
  case 'ksms':return k.sms.replace(/\D/g,'').length>=10?toast('SMS enviado para '+k.sms+' (simulado)'):toast('Digite um celular com DDD para enviar o SMS');
  case 'pnew':S.p.draft=newDraft();S.p.errs={};S.p.scr='form';return render(true);
  case 'pcat':S.p.draft.cat=d.k;delete S.p.errs.cat;return render();
  case 'pdia':{const x=S.p.draft.dias;const i=x.indexOf(d.v);i<0?x.push(d.v):x.splice(i,1);delete S.p.errs.dias;return render()}
  case 'pcancel':case 'plist':S.p.scr='lista';return render(true);
  case 'prev':if(pvalidate()){S.p.scr='rev';return render(true)}render();{const f=document.querySelector('.err');if(f)f.scrollIntoView({block:'center'})}return;
  case 'pback':S.p.scr='form';return render(true);
  case 'ppub':{const p=addAcao(S.p.draft);S.p.last=p.id;S.p.scr='ok';return render(true)}
  case 'poff':{const p=findP(d.id);p.off=!p.off;toast(p.off?'Ação pausada. Ela saiu do app e do totem.':'Ação publicada de novo.');return}
  case 'pview':S.mode='app';a.tab='home';a.cat=d.c;a.view='lista';a.openOnly=false;a.stack=['home','agora','mapa'];return render(true);
  case 'kreset':S.k={scr:'inicio',nome:'',cpf:'',noCpf:false,doc:null,posto:'p1',dia:null,hora:null,printed:false,sms:''};return render(true);
 }
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.in){A().cvDraft[t.dataset.in]=t.value;render()}
 if(t.dataset.kin){S.k[t.dataset.kin]=t.value;render()}
 if(t.dataset.pin){S.p.draft[t.dataset.pin]=t.value}
});
try{if(location.hash==='#totem')S.mode='kiosk';if(location.hash==='#parceiro')S.mode='partner'}catch(e){}
render(true);
</script>

</html>
